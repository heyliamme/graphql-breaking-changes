name: Bug report
description: A change that was missed or misjudged, a crash, or something that looks off
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a misjudged change, say which level you expected and why a client would or wouldn't break.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The two schemas
      description: The smallest old and new schema that show the problem (redact anything private). The output of "Copy as Markdown" helps too.
      render: graphql
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, VS Code (or other editor) and the extension version
    validations:
      required: true
